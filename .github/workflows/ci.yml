name: CI

on:
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.14.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: prettier
        name: Check Prettier formatting
        run: pnpm prettier --check .
        continue-on-error: true

      - id: types
        name: Run type check (recursive)
        run: pnpm -r run types:check
        continue-on-error: true

      - id: lint
        name: Run lint (recursive)
        run: pnpm -r run lint
        continue-on-error: true

      - name: Fail if any checks failed
        if: |
          steps.prettier.outcome == 'failure' ||
          steps.types.outcome == 'failure' ||
          steps.lint.outcome == 'failure'
        run: |
          echo "One or more checks failed:"
          echo "  Prettier: ${{ steps.prettier.outcome }}"
          echo "  Types:    ${{ steps.types.outcome }}"
          echo "  Lint:     ${{ steps.lint.outcome }}"
          exit 1
